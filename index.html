<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/bluebell-app/favicon.svg" />
    <link rel="apple-touch-icon" href="/bluebell-app/icons/icon-192.png" />
    <link rel="manifest" href="/bluebell-app/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#331948" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bluebell" />
    <meta name="description" content="Event management app for Bluebell Event Planners LLP" />
    <title>Bluebell</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // GitHub Pages SPA redirect handler
      // Restores the real URL from ?p= query param before React mounts
      (function() {
        var params = new URLSearchParams(window.location.search);
        var redirectPath = params.get('p');
        if (redirectPath) {
          params.delete('p');
          var remaining = params.toString();
          var newUrl = redirectPath + (remaining ? '?' + remaining : '');
          window.history.replaceState(null, '', newUrl);
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/bluebell-app/sw.js', {scope: '/bluebell-app/'})
            .then(function(reg) {
              console.log('SW registered');
              // Check for updates periodically
              setInterval(function() { reg.update(); }, 60 * 60 * 1000);
            })
            .catch(function(err) { console.log('SW registration failed:', err); });
        });
      }
    </script>
  </body>
</html>
